name: Mira Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Inspect and Unzip
      run: |
        ls -la
        unzip -q VoiceAssistant.zip -d extracted_app
        echo "=== Files inside extracted_app ==="
        find extracted_app -maxdepth 3

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build with Gradle
      run: |
        GRADLEW_PATH=$(find extracted_app -name "gradlew" | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "gradlew not found, looking for build.gradle"
          BUILD_GRADLE=$(find extracted_app -name "build.gradle*" | head -n 1)
          PROJ_DIR=$(dirname "$BUILD_GRADLE")
          cd "$PROJ_DIR"
          gradle assembleDebug --stacktrace
        else
          PROJ_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJ_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Mira-VoiceAssistant-APK
        path: '**/*.apk'
