name: Mira Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Extract Project
      run: |
        mkdir -p extracted_app
        unzip -q VoiceAssistant.zip -d extracted_app

    - name: Build APK with Gradle
      run: |
        SETTINGS_FILE=$(find extracted_app -name "settings.gradle*" | head -n 1)
        if [ -n "$SETTINGS_FILE" ]; then
          ROOT_DIR=$(dirname "$SETTINGS_FILE")
        else
          BUILD_FILE=$(find extracted_app -name "build.gradle*" | head -n 1)
          ROOT_DIR=$(dirname "$BUILD_FILE")
        fi
        
        echo "Root Project Directory: $ROOT_DIR"
        cd "$ROOT_DIR"

        if [ ! -f "./gradlew" ]; then
          gradle wrapper
        fi
        chmod +x ./gradlew
        
        ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: VoiceAssistant-APK
        path: '**/*.apk'
