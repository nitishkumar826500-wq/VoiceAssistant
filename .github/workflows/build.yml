name: Mira Build APK
on:
workflow_dispatch:
push:
branches: [ main ]
jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout Repository
uses: actions/checkout@v4
- name: Set up JDK 17
uses: actions/setup-java@v4
with:
java-version: '17'
distribution: 'temurin'
- name: Setup Gradle
uses: gradle/actions/setup-gradle@v3
with:
gradle-version: '8.4'
- name: Extract Project
run: |
mkdir -p extracted_app
unzip -q VoiceAssistant.zip -d extracted_app
- name: Fix Missing Libs and Build APK
run: |
TARGET_DIR=$(find extracted_app -name "build.gradle.kts" -exec dirname {} ; | head -n 1)
echo "Project directory found: $TARGET_DIR"
cd "$TARGET_DIR"
mkdir -p gradle
cat << 'EOF' > gradle/libs.versions.toml
[versions]
agp = "8.2.0"
kotlin = "1.9.20"
[libraries]
[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
EOF
if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
echo 'rootProject.name = "VoiceAssistant"' > settings.gradle.kts
fi
if [ -f "./gradlew" ]; then
chmod +x ./gradlew
./gradlew assembleDebug --stacktrace --no-daemon
else
gradle assembleDebug --stacktrace --no-daemon
fi
- name: Upload APK
uses: actions/upload-artifact@v4
with:
name: VoiceAssistant-APK
path: '/*.apk''
